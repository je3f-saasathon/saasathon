name: saasathon-prod

# env_file paths point OUTSIDE this git checkout — production secrets are
# never committed. Default layout on the prod host:
#   ${ENV_FILE_DIR:-/home/$(whoami)/prod-saasathon}/backend/.env.prod
#   ${ENV_FILE_DIR:-/home/$(whoami)/prod-saasathon}/frontend/.env.prod
# Set ENV_FILE_DIR in the shell (or a systemd unit / CI runner env) if you
# want a different location. See docs/DEPLOYMENT.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE_DIR:-/home/nobody/prod-saasathon}/backend/.env.prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - ${ENV_FILE_DIR:-/home/nobody/prod-saasathon}/backend/.env.prod
    environment:
      OTEL_CLICKHOUSE_URL: http://telemetry-clickhouse:8123
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # GitHub App private key (GITHUB_APP_PRIVATE_KEY_PATH=/secrets/<file>.pem): the
      # backend lists an installation's repos when a project is created.
      - ${ENV_FILE_DIR:-/home/nobody/prod-saasathon}/secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_started
      telemetry-clickhouse:
        condition: service_healthy
    command: sh -c "uv run python manage.py migrate --noinput && uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  # Temporal for the SRE agent's workflows: a single-node dev server persisted
  # to a volume, fine for one box. Only reachable on the compose network
  # (TEMPORAL_ADDRESS=temporal:7233); inspect it with
  # `docker compose -f docker-compose.prod.yml exec temporal temporal workflow list`.
  temporal:
    image: temporalio/temporal:latest
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    user: "0:0"  # the sqlite volume is root-owned
    volumes:
      - temporal_data_prod:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  # SRE agent Temporal worker. TEMPORAL_ADDRESS (temporal:7233) and the optional
  # LANGFUSE_* come from .env.prod, see docs/DEPLOYMENT.md.
  sre-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - ${ENV_FILE_DIR:-/home/nobody/prod-saasathon}/backend/.env.prod
    environment:
      DOCKER_HOST: tcp://sre-docker:2375
      SRE_WORKDIR: /sre-work
    volumes:
      - sre_work:/sre-work
      - ${ENV_FILE_DIR:-/home/nobody/prod-saasathon}/secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_started
      sre-docker:
        condition: service_started
      temporal:
        condition: service_healthy
    command: uv run python -m sre.worker

  telemetry-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    env_file:
      - ${ENV_FILE_DIR:-/home/nobody/prod-saasathon}/backend/.env.prod
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${OTEL_CLICKHOUSE_USER:-otel_ingest}
      CLICKHOUSE_PASSWORD: ${OTEL_CLICKHOUSE_PASSWORD:-}
    volumes:
      - telemetry_clickhouse_data_prod:/var/lib/clickhouse
      - telemetry_clickhouse_logs_prod:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  # Docker daemon the worker runs sandboxes on, so a sandbox escape lands in
  # this container, not on the host. Plain TCP is fine: it's only reachable on
  # the compose network and is never published. Build the sandbox image into
  # it with `make sandbox-image-prod`.
  sre-docker:
    image: docker:27-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      # Same path as the worker so sandbox bind mounts resolve. Never under /tmp:
      # the dind image mounts a tmpfs over /tmp, hiding anything mounted there.
      - sre_work:/sre-work
      - sre_docker_data:/var/lib/docker
      - ./backend/sre/sandbox:/sandbox:ro
      # Public resolvers: dind breaks the embedded DNS (see the file's comment).
      - ./backend/sre/sandbox/dind-resolv.conf:/etc/resolv.conf:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE_DIR:-/home/nobody/prod-saasathon}/frontend/.env.prod
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

  # ---------------------------------------------------------------------
  # Example standalone service, mirrored from docker-compose.yml. Uncomment
  # once a real service exists.
  # ---------------------------------------------------------------------
  # example-service:
  #   build:
  #     context: ./backend/services/example
  #     dockerfile: Dockerfile
  #     target: prod
  #   restart: unless-stopped
  #   env_file:
  #     - ${ENV_FILE_DIR:-/home/nobody/prod-saasathon}/services/example/.env.prod
  #   ports:
  #     - "8100:8100"

volumes:
  postgres_data_prod:
  sre_work:
  sre_docker_data:
  telemetry_clickhouse_data_prod:
  telemetry_clickhouse_logs_prod:
  temporal_data_prod:
