# Uptrace config for saasathon, based on the fake-repos one (itself trimmed from
# https://github.com/uptrace/uptrace/blob/master/example/docker/uptrace.yml).
# Every secret is an ${ENV_VAR} from infra/uptrace/.env; nothing secret is committed.

service:
  env: production
  secret: ${UPTRACE_SECRET}

site:
  url: ${UPTRACE_SITE_URL}
  ingest_url: ${UPTRACE_SITE_URL}

listen:
  http:
    addr: :80
  grpc:
    addr: :4317

seed_data:
  update: true
  delete: false

  users:
    - key: admin
      name: Admin
      email: ${UPTRACE_ADMIN_EMAIL}
      password: ${UPTRACE_ADMIN_PASSWORD}
      email_confirmed: true

  # API token for the SRE worker (Authorization: Bearer ...), user-scoped.
  user_tokens:
    - key: sre_worker
      user_key: admin
      token: ${UPTRACE_API_TOKEN}

  orgs:
    - key: saasathon
      name: saasathon

  org_users:
    - key: admin_saasathon
      org_key: saasathon
      user_key: admin
      role: owner

  projects:
    - key: saasathon
      name: saasathon
      org_key: saasathon

  # The DSN token apps send telemetry with.
  project_tokens:
    - key: saasathon_ingest
      project_key: saasathon
      token: ${UPTRACE_PROJECT_TOKEN}

  project_users:
    - key: admin_saasathon_project
      project_key: saasathon
      org_user_key: admin_saasathon
      perm_level: admin

ch_cluster:
  cluster: uptrace1
  replicated: false
  distributed: false
  shards:
    - replicas:
        - addr: clickhouse:9000
          database: uptrace
          user: uptrace
          password: ${UPTRACE_CH_PASSWORD}
          dial_timeout: 3s
          write_timeout: 5s
          max_retries: 3
          max_execution_time: 15s

pg:
  addr: postgres:5432
  user: uptrace
  password: ${UPTRACE_PG_PASSWORD}
  database: uptrace

ch_schema:
  compression: ZSTD(1)
  spans_index: { storage_policy: default }
  spans_data: { storage_policy: default }
  span_links: { storage_policy: default }
  logs_index: { storage_policy: default }
  logs_data: { storage_policy: default }
  events_index: { storage_policy: default }
  events_data: { storage_policy: default }
  timeseries: { storage_policy: default }
  datapoints: { storage_policy: default }

redis_cache:
  addrs:
    1: redis:6379
  username: ""
  password: ""
  db: 0

mailer:
  smtp:
    enabled: false

self_monitoring:
  disabled: true

logging:
  level: INFO
