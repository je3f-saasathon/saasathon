# DNS for the sre-docker (docker:dind) sidecar. Its dockerd rewrites the
# container's iptables, which breaks Docker's embedded DNS at 127.0.0.11
# (SERVFAIL on every lookup), so image pulls fail. It never needs to resolve
# compose service names (the worker connects to it, not the reverse).
nameserver 1.1.1.1
nameserver 8.8.8.8
