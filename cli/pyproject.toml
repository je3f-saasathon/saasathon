[project]
name = "buggly"
version = "0.1.0"
description = "Run your app with its errors sent to buggly, which opens an incident and a fix PR."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-distro>=0.66b0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-django>=0.66b0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-flask>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-instrumentation-logging>=0.66b0",
    "opentelemetry-instrumentation-psycopg>=0.66b0",
    "opentelemetry-instrumentation-psycopg2>=0.66b0",
    "opentelemetry-instrumentation-requests>=0.66b0",
    "opentelemetry-instrumentation-sqlite3>=0.66b0",
    "opentelemetry-instrumentation-urllib3>=0.66b0",
]

[project.scripts]
buggly = "buggly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buggly"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
