name: Deploy frontend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, je3f-saasathon-oma, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Load prod env
        run: |
          env_file_dir="${ENV_FILE_DIR:-$HOME/prod-saasathon}"
          echo "ENV_FILE_DIR=$env_file_dir" >> "$GITHUB_ENV"
          port=$(grep -E '^FRONTEND_PORT=' "$env_file_dir/frontend/.env.prod" | tail -n1 | cut -d= -f2-)
          echo "FRONTEND_PORT=${port:-5173}" >> "$GITHUB_ENV"

      - name: Build and start frontend
        run: docker compose --env-file "$ENV_FILE_DIR/frontend/.env.prod" -f docker-compose.prod.yml up -d --no-deps --build frontend

      - name: Health check
        run: |
          url="http://localhost:${FRONTEND_PORT:-5173}/"
          host_header="dev.andrewplescan.com"
          echo "checking $url with Host: $host_header"
          attempt=0
          max_attempts=15
          delay=2
          until curl -fsS -H "Host: $host_header" "$url" >/dev/null; do
            attempt=$((attempt+1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "frontend health check failed after $attempt attempts"
              docker compose -f docker-compose.prod.yml logs --tail 100 frontend
              exit 1
            fi
            sleep "$delay"
            delay=$((delay * 2))
            [ "$delay" -gt 30 ] && delay=30
          done
          echo "frontend healthy"

      - name: Prune old images
        if: always()
        run: docker image prune -f
