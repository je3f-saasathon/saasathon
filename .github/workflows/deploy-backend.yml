name: Deploy backend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, je3f-saasathon-oma, backend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Load prod env
        run: |
          env_file_dir="${ENV_FILE_DIR:-$HOME/prod-saasathon}"
          echo "ENV_FILE_DIR=$env_file_dir" >> "$GITHUB_ENV"
          port=$(grep -E '^BACKEND_PORT=' "$env_file_dir/backend/.env.prod" | tail -n1 | cut -d= -f2-)
          echo "BACKEND_PORT=${port:-8000}" >> "$GITHUB_ENV"

      - name: Build and start backend
        # No --no-deps here (unlike frontend): backend's own .env.prod is
        # the single source of truth for postgres's env too, so bringing
        # postgres up alongside backend is safe and necessary on a fresh
        # host where postgres has never been started.
        run: docker compose --env-file "$ENV_FILE_DIR/backend/.env.prod" -f docker-compose.prod.yml up -d --build postgres backend

      - name: Health check
        run: |
          url="http://localhost:${BACKEND_PORT:-8000}/api/health"
          host_header="api-dev.andrewplescan.com"
          echo "checking $url with Host: $host_header"
          attempt=0
          max_attempts=15
          delay=2
          until curl -fsS -H "Host: $host_header" "$url" >/dev/null; do
            attempt=$((attempt+1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "backend health check failed after $attempt attempts"
              docker compose -f docker-compose.prod.yml logs --tail 100 backend
              exit 1
            fi
            sleep "$delay"
            delay=$((delay * 2))
            [ "$delay" -gt 30 ] && delay=30
          done
          echo "backend healthy"

      # After the backend is healthy, so an SRE problem can't block the main deploy.
      # The worker ships from the backend image; it must be rebuilt with it or it
      # keeps running old code.
      - name: Start SRE agent services
        run: docker compose --env-file "$ENV_FILE_DIR/backend/.env.prod" -f docker-compose.prod.yml up -d --build temporal sre-docker sre-worker

      - name: Build sandbox image
        # Built inside the dind sidecar (sandboxes never run on the host's Docker).
        # Layers are cached in its volume, so this is quick when nothing changed.
        run: |
          compose="docker compose --env-file $ENV_FILE_DIR/backend/.env.prod -f docker-compose.prod.yml"
          for attempt in $(seq 1 30); do
            $compose exec -T sre-docker docker info >/dev/null 2>&1 && break
            sleep 2
          done
          $compose exec -T sre-docker docker build -t saasathon-sre-sandbox:latest /sandbox

      - name: Prune old images
        if: always()
        run: docker image prune -f
