name: Publish CLI

# Publishes cli/ (the `buggly` package) to PyPI when a tag cli-v<version> is pushed. Uses
# PyPI trusted publishing: no token is stored. Set up once on pypi.org → Your account →
# Publishing → Add a pending publisher: project `buggly`, owner `je3f-saasathon`, repository
# `saasathon`, workflow `publish-cli.yml`, environment `pypi`.

on:
  push:
    tags: ["cli-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Tag matches the package version
        run: |
          version=$(grep -m1 '^version = ' cli/pyproject.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME#cli-v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version in cli/pyproject.toml"
            exit 1
          fi
      - name: Test
        working-directory: cli
        run: uv run pytest
      - name: Build
        working-directory: cli
        run: uv build --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cli/dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
