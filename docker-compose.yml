name: saasathon

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saasathon
      POSTGRES_USER: saasathon
      POSTGRES_PASSWORD: saasathon
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saasathon"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://saasathon:saasathon@postgres:5432/saasathon
      # SRE infra (docker-compose.infra.yml) is published on the host.
      TEMPORAL_ADDRESS: host.docker.internal:${TEMPORAL_PORT:-7243}
      LANGFUSE_HOST: http://host.docker.internal:${LANGFUSE_PORT:-3100}
      OTEL_CLICKHOUSE_URL: http://host.docker.internal:${OTEL_CLICKHOUSE_PORT:-8124}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      # Keep the container's venv out of the bind mount, or it overwrites the
      # host's backend/.venv with a root-owned one that native `uv run` can't use.
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    # Migrate on start so new app tables (e.g. sre) exist in the docker Postgres.
    command: sh -c "uv run python manage.py migrate --noinput && uv run python manage.py runserver 0.0.0.0:8000"

  # SRE agent Temporal worker. Local dev only: it gets the host's Docker
  # socket to start sandboxes (effectively root on this machine). Prod uses a
  # docker:dind sidecar instead, see docker-compose.prod.yml.
  sre-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://saasathon:saasathon@postgres:5432/saasathon
      TEMPORAL_ADDRESS: host.docker.internal:${TEMPORAL_PORT:-7243}
      LANGFUSE_HOST: http://host.docker.internal:${LANGFUSE_PORT:-3100}
      SRE_WORKDIR: /tmp/sre-work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - /app/.venv
      # Local secrets (GitHub App .pem) at the same path as on the host, so
      # GITHUB_APP_PRIVATE_KEY_PATH in backend/.env works in both modes.
      - ${HOME}/.config/saasathon:${HOME}/.config/saasathon:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and out: the sandbox bind-mounts checkouts via the host daemon.
      - /tmp/sre-work:/tmp/sre-work
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: uv run python -m sre.worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: pnpm dev --host --port 5173

  # ---------------------------------------------------------------------
  # Example standalone service (backend/services/*). Uncomment and copy
  # once a real service exists. Each service gets its own port starting
  # at 8100, its own Dockerfile, and a shared-secret or bearer check.
  # ---------------------------------------------------------------------
  # example-service:
  #   build:
  #     context: ./backend/services/example
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   env_file:
  #     - ./backend/services/example/.env
  #   ports:
  #     - "8100:8100"
  #   volumes:
  #     - ./backend/services/example:/app

volumes:
  postgres_data:
